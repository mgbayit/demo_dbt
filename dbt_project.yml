name: 'demo_dbt'
version: '1.0.0'
config-version: 2

profile: 'demo_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  demo_dbt:
    example:
      +materialized: view
      +tags:
        - tag_random

vars:
  countries: ["France", "Spain", "Germany", "United States"]

